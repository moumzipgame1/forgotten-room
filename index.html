<style>
:root{--bg:#e6eaec;--fg:#1b252e;--mut:#5d6a75;--pan:#f3f6f7;--line:#b4bfc7;--acc:#a33232;--ice:#2f6f80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1217;--fg:#d3dce3;--mut:#8796a3;--pan:#151c23;--line:#2b3742;--acc:#d06a5f;--ice:#7fc0d1}}
:root[data-theme="dark"]{--bg:#0d1217;--fg:#d3dce3;--mut:#8796a3;--pan:#151c23;--line:#2b3742;--acc:#d06a5f;--ice:#7fc0d1}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.75 "Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% 0,color-mix(in srgb,var(--fg) 9%,transparent),transparent 70%),radial-gradient(90% 50% at 20% 100%,color-mix(in srgb,var(--ice) 12%,transparent),transparent);animation:fog 14s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(3%) scale(1.06)}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
#app{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
h1{font-size:15px;font-weight:600;margin:0;color:var(--mut);letter-spacing:.04em}
#place{font-size:22px;font-weight:700;margin:14px 0 2px}
#desc{margin:0 0 12px;color:var(--mut);font-size:15px}
#log{background:color-mix(in srgb,var(--pan) 76%,transparent);backdrop-filter:blur(2px);border:1px solid var(--line);border-radius:6px;padding:12px 14px;height:34vh;min-height:180px;overflow-y:auto}
#log p{margin:0 0 10px;white-space:pre-line}
#log p.sys{color:var(--ice);font-size:14px}
#log p{opacity:.6;transition:opacity .3s}
#log p.new{opacity:1;border-left:3px solid var(--acc);padding-left:10px;font-weight:600;animation:in .6s}
#log p.sys.new{font-weight:400}
@keyframes in{from{opacity:0}}
#spots{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
#spots button,.chip,.btn{background:var(--pan);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
#spots button:hover,.btn:hover{border-color:var(--ice)}
.lbl{font-size:13px;color:var(--mut);letter-spacing:.08em;margin:12px 0 -6px}#moves{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}#moves button{background:transparent;border:1px dashed var(--ice);color:var(--ice);border-radius:999px;padding:8px 14px}#moves button:hover{background:color-mix(in srgb,var(--ice) 14%,transparent)}#chp{display:none;flex-direction:column;gap:8px;margin:14px 0}#chp.on{display:flex}#chp .btn{text-align:left;border-color:var(--acc)}
#inv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:38px}
#inv b{font-weight:600;color:var(--mut);font-size:14px}
.chip.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
#code{display:none;margin:12px 0;padding:12px;border:1px solid var(--acc);border-radius:6px;background:var(--pan)}
#code.on{display:block}
#code input{font:inherit;width:7em;padding:6px 8px;margin:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);letter-spacing:.3em;text-align:center}
details{margin-top:14px;border:1px solid var(--line);border-radius:6px;background:var(--pan)}
summary{cursor:pointer;padding:10px 14px;font-weight:600}
details ul{margin:0;padding:0 14px 12px 32px;color:var(--mut);font-size:15px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ov{position:fixed;inset:0;z-index:5;background:var(--bg);display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8vh) 22px 40px}
.ov.on{display:block}
.ov>div{max-width:520px;margin:0 auto}
.ov h2{font-size:34px;margin:0 0 6px;letter-spacing:.2em}
.ov .sub{color:var(--mut);margin:0 0 26px}
.ov .q{color:var(--mut);font-size:15px;padding-left:18px}
.tag{display:inline-block;border:1px solid var(--acc);color:var(--acc);padding:0 8px;border-radius:3px;font-size:14px}
#scene,#timg,.eimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:6px;margin:12px 0 4px}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(7px);transform:scale(1.06);opacity:0;transition:opacity .9s}
#bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.74}
#splash{position:fixed;inset:0;z-index:4;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;cursor:pointer}
#splash.on{opacity:1;pointer-events:auto}
#splash img{display:block;width:100%;height:calc(100% - 96px);object-fit:contain}
#splash .spt{position:absolute;left:0;right:0;bottom:0;height:96px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 22px env(safe-area-inset-bottom,0px);color:#e8eef2}
#splash b{font-size:24px;letter-spacing:.06em}
#splash span{font-size:13px;opacity:.75}
#timg,.eimg{max-width:520px;margin:0 auto 22px}

4:f=>{if(!f.lg)return'책상 위 서류를 살펴보세요.';if(!f.safe)return'근무일지의 날짜가 금고 번호입니다. (월일 4자리)';if(!f.broke)return'강태식에게 가장 확실한 증거를 사용하세요. 직함보다 그날 그 자리에 있었다는 증거가 필요합니다.';return'책상 위 사진, 보안 시스템을 확인한 뒤 비밀 통로로 가세요.'},
5:f=>{if(!f.fd)return'비상벨 시각과 방화문 패널의 설명을 합쳐 보세요. (비상벨 + 9분)';if(!f.key){if(!has('grab'))return has('magnet')&&has('line')?'자석과 낚싯줄을 조합해 보세요.':'공구함과 찢어진 가방을 살펴보세요.';return'배수구 격자에 회수 도구를 사용하세요.'}return f.box?'화재 현장의 흔적을 확인하세요.':'방화문 안쪽의 금속 상자에 열쇠를 사용하세요.'},
6:f=>{if(!f.con)return'모니터에 적힌 연도가 작은 순서대로 번호를 입력하세요.';if(!f.fake){if(has('photoF'))return'복원된 가족사진을 모니터 3에 사용해 보세요.';if(has('photoAt'))return'테이프를 붙인 조각과 사진 조각 B를 조합해 보세요.';if(has('photoB')&&has('tape')&&has('photoA'))return'찢어진 사진과 접착테이프를 먼저 조합해 보세요.';return'의자 밑과 서랍을 살펴 사진 조각과 테이프를 찾으세요.'}return'모니터 속 수민을 확인하세요.'},
7:f=>{if(!f.door){if(!has('rtorch')){return has('shard')&&has('torch')?'손전등과 거울 조각을 조합해 보세요.':'701호와 702호를 살펴보세요.'}return'복도 끝 벽에 반사 손전등을 사용하세요.'}if(!f.open)return'시설 도면에 빠진 방 번호를 입력하세요.';return f.diary?'울리기 시작한 경보음을 확인하세요.':'일기장을 살펴보세요.'},

9:f=>{if(!f.unlock)return'수민이 떠난 해를 기억 실험실에서 찾았습니다. (4자리)';if(f.dk!==3)return'백업 디스크 세 개를 모두 찾아 서버에 사용하세요. 잠긴 서랍에는 마스터키가 필요합니다.';if(!f.rc)return'녹음기에 잡음 제거 장치를 조합해 보세요.';if(!f.q2)return'진실 대조 단말에서 백업 기록을 근거로 답하세요.';return'스피커의 목소리를 확인하세요.'},
10:f=>{if(S.room==='door10')return'수민의 방 번호 703을 떠올려 보세요. (월일 4자리: 생일은 7월 3일)';if(!f.vid)return'영상 재생기를 먼저 확인하세요.';if(!has('fuse'))return'의자 밑 비상 퓨즈 상자를 살펴보세요.';return'퓨즈를 세 장치 중 하나에 사용하세요. 선택에 따라 엔딩이 달라집니다.'}};
const HINTS=()=>H[S.ch](S.f);

/* ---------- 엔진 ---------- */
function render(){
 const R=ROOMS[S.room];sceneImg();$("h1t").textContent="망각의 방 – CHAPTER "+String(S.ch).padStart(2,"0");$("place").textContent=R.name;$("desc").textContent=R.desc;
 const lg=$("log");lg.innerHTML="";S.log.forEach((t,i)=>{const p=document.createElement("p");if(i>=(S.from||0))p.classList.add("new");if(t[0]==="§"){p.classList.add("sys");p.textContent="▸ "+t.slice(1)}else p.textContent=t;lg.appendChild(p)});lg.scrollTop=lg.scrollHeight;
 const sp=$("spots"),mv=$("moves");sp.innerHTML="";mv.innerHTML="";R.spots.filter(h=>!h.show||h.show()).forEach(h=>{const b=document.createElement("button");b.textContent=h.nav?"→ "+h.n:h.n;b.onclick=()=>click(h);(h.nav?mv:sp).appendChild(b)});
 const iv=$("inv");iv.innerHTML="<b>가방</b>";if(!S.inv.length)iv.insertAdjacentHTML("beforeend",'<span style="color:var(--mut);font-size:14px">비어 있음</span>');
 S.inv.forEach(id=>{const b=document.createElement("button");b.className="chip"+(S.sel===id?" sel":"");b.textContent=ITEMS[id][0];b.title=ITEMS[id][1];b.onclick=()=>pick(id);iv.appendChild(b)});
 $("notes").innerHTML="";S.notes.forEach(n=>{const li=document.createElement("li");li.textContent=n[1];$("notes").appendChild(li)});$("nc").textContent="("+S.notes.length+")";
 $("code").classList.toggle("on",!!CODE);$("acts").style.display=CH?"none":"";$("mw").style.display=mv.children.length?"":"none";const cp=$("chp");cp.innerHTML="";cp.classList.toggle("on",!!CH);if(CH)CH.forEach(o=>{const b=document.createElement("button");b.className="btn";b.textContent=o.t;b.onclick=()=>{if(tick())return;S.from=S.log.length;const f=o.f;CH=null;f()};cp.appendChild(b)});
 $("endv").classList.toggle("on",!!S.over);if(S.over){const e=ENDS[S.over];$("endc").innerHTML=(EI[S.over]?'<img class="eimg" alt="" src="'+EI[S.over]+'">':'')+(typeof e==="function"?e():e)}save()}
function click(h){if(tick())return;S.from=S.log.length;const s=S.sel;S.sel=null;CODE=null;
 if(s&&!h.nav){const u=h.use&&h.use[s];if(u)u();else say("“"+ITEMS[s][0]+"”은(는) 여기에 쓸 수 없다.");return}
 h.look()}
function pick(id){if(tick())return;S.from=S.log.length;const s=S.sel;
 if(s&&s!==id){const cb=COMBOS[[s,id].sort().join()];
  if(cb){take(s);take(id);S.sel=null;S.log.push(cb[1]);if(cb[4])cb[4]();give(cb[0]);if(cb[2])note(cb[2],cb[3]);render();return}
  if(REAG.includes(s)&&REAG.includes(id)){S.sel=null;say("시약병 두 개를 섞자 거품이 일며 경보음이 짧게 울린다. 이 조합이 아닌 것 같다. 약품 라벨을 다시 읽어 보자.");return}}
 S.sel=s===id?null:id;if(S.sel)say("“"+ITEMS[id][0]+"” 선택 — 사용할 곳을 누르세요. "+ITEMS[id][1]);else render()}
$("codeb").onclick=()=>{if(!CODE)return;if(tick())return;S.from=S.log.length;const v=$("codein").value.trim(),c=CODE;if(v===c.ans){CODE=null;$("code").classList.remove("on");c.ok()}else say("틀렸다. 차가운 전자음만 울린다.")};
$("codein").onkeydown=e=>{if(e.key==="Enter")$("codeb").click()};
$("hintb").onclick=()=>{if(S){S.from=S.log.length;sys("힌트 — "+HINTS());render()}};
const STARTS={2:()=>startCh(2,'office','복도를 따라 이동한 끝에 연구원 사무실에 도착한다. 책상 네 개, 꺼진 컴퓨터, 그리고 벽에 붙은 사진들.'),
3:()=>startCh(3,'ward3','연구동을 빠져나와 병동으로 향한다. 병동은 이상할 만큼 깨끗하다. 가장 안쪽 격리실에서 누군가 벽을 두드린다.'),
4:()=>startCh(4,'sec','보안실에서 강태식이 총을 겨눈다. “여기까지 어떻게 들어왔지?” 진우라는 이름을 말하자 그의 표정이 굳는다.'),
5:()=>startCh(5,'burn','폐쇄된 연구 구역에 들어선다. 10년 전 화재가 발생한 장소다. 벽은 검게 그을려 있다.'),
6:()=>startCh(6,'mem','기억 실험실. 나란히 놓인 의자 앞 모니터마다 내 과거가 재생되고 있다. 소녀의 얼굴은 늘 흐릿하다.'),
7:()=>startCh(7,'dorm','지하 거주구역. 복도를 걷는 내내 흰 환자복의 소녀가 나타났다 사라진다. “오빠, 나 기억났어?”'),
8:()=>startCh(8,'central','중앙 연구실. 한도윤은 처음부터 나를 기다리고 있었다.'),
9:()=>startCh(9,'server','최하층 서버실. 10년 동안 삭제되지 않은 원본 기록이 이곳에 있다.'),
10:()=>startCh(10,'door10','시설의 가장 깊은 곳. 문에는 숫자 10이 적혀 있다.')};
function begin(s){S=s;CODE=null;CH=null;$("title").classList.remove("on");if(!S.log.length)say("차가운 바닥 위에서 눈을 뜬다. 기억나는 것은 이름뿐이다. 물건들을 하나씩 조사해 보자.");else render()}
$("start").onclick=()=>begin(fresh());
$("cont").onclick=()=>begin(load());
$("reset").onclick=()=>{if(confirm("처음부터 다시 시작할까요?"))begin(fresh())};
$("endc").onclick=e=>{const a=e.target.dataset.act;if(!a)return;if(/^c\d+$/.test(a)){S.over=0;if(tick())return;STARTS[+a.slice(1)]()}else if(a==='back'){S.over=0;render()}else if(a==='again')begin(fresh())};
if(load())$("cont").style.display="";

let SPT=null;
function hideSp(){$("splash").classList.remove("on")}
function sceneImg(){const bg=$("bg"),sp=$("splash");if(!bg||!sp)return;const im=S&&IMGS[S.room];if(!im){bg.style.opacity=0;return}if(bg.dataset.k===S.room)return;bg.dataset.k=S.room;bg.style.backgroundImage='url("'+im+'")';bg.style.opacity=1;$("spimg").src=im;$("spn").textContent=ROOMS[S.room].name;sp.classList.add("on");clearTimeout(SPT);SPT=setTimeout(hideSp,2800)}
$("splash").onclick=hideSp;
try{$("timg").src=IMGS.title}catch(e){}
